[workspace]
resolver = "2"
members = [
    "crates/tyl-core",
    "crates/tyl-platform",
    "crates/tyl-cli",
    "apps/tyl-app/src-tauri",
]

[workspace.package]
version = "0.1.0-beta.2"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tyl-core = { path = "crates/tyl-core" }
tyl-platform = { path = "crates/tyl-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "charset", "query", "form", "rustls-no-provider"] }
hmac = "0.12"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures-util = "0.3"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Speech",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = true
