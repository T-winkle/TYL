<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">TYL 性能概览</title>
  <desc id="desc">UIA 取词中位延迟 4 毫秒，剪贴板兼容取词中位延迟 87 毫秒，后台专用工作集约 28.6 MiB，Release 主程序约 14 MB。固定负载下关闭 GPU 的私有内存约 135 MiB，开启 GPU 约 245 MiB。</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4058a6"/>
      <stop offset="1" stop-color="#6f82cb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#253252" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="28" fill="#f4f6fb"/>
  <text x="44" y="48" fill="#4f64ad" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" letter-spacing="2">PERFORMANCE</text>
  <text x="44" y="82" fill="#192235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="25" font-weight="700">快一点，也轻一点</text>
  <text x="1156" y="78" text-anchor="end" fill="#758096" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14">Windows · Release</text>

  <g filter="url(#shadow)">
    <rect x="44" y="112" width="260" height="150" rx="18" fill="#ffffff" stroke="#dfe4ef"/>
    <rect x="326" y="112" width="260" height="150" rx="18" fill="#ffffff" stroke="#dfe4ef"/>
    <rect x="608" y="112" width="260" height="150" rx="18" fill="#ffffff" stroke="#dfe4ef"/>
    <rect x="890" y="112" width="266" height="150" rx="18" fill="#ffffff" stroke="#dfe4ef"/>
  </g>

  <text x="66" y="145" fill="#6d788b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15">UIA 取词中位</text>
  <text x="66" y="204" fill="#4058a6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="48" font-weight="750">4<tspan font-size="22" font-weight="600"> ms</tspan></text>
  <text x="66" y="238" fill="#929bab" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13">P95 · 8 ms</text>

  <text x="348" y="145" fill="#6d788b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15">兼容通道取词中位</text>
  <text x="348" y="204" fill="#4058a6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="48" font-weight="750">87<tspan font-size="22" font-weight="600"> ms</tspan></text>
  <text x="348" y="238" fill="#929bab" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13">P95 · 122 ms</text>

  <text x="630" y="145" fill="#6d788b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15">后台专用工作集</text>
  <text x="630" y="204" fill="#4058a6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="48" font-weight="750">28.6<tspan font-size="20" font-weight="600"> MiB</tspan></text>
  <text x="630" y="238" fill="#929bab" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13">当前安装版 · 托盘后台</text>

  <text x="912" y="145" fill="#6d788b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="15">Release 主程序</text>
  <text x="912" y="204" fill="#4058a6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="48" font-weight="750">14<tspan font-size="22" font-weight="600"> MB</tspan></text>
  <text x="912" y="238" fill="#929bab" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13">前端资源已内嵌</text>

  <rect x="44" y="286" width="1112" height="222" rx="20" fill="#ffffff" stroke="#dfe4ef"/>
  <text x="68" y="326" fill="#192235" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" font-weight="700">后台私有内存</text>
  <rect x="986" y="305" width="146" height="34" rx="17" fill="#e9edfa"/>
  <text x="1059" y="327" text-anchor="middle" fill="#4058a6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="700">约降低 45%</text>

  <text x="68" y="383" fill="#58657a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14">默认低内存策略</text>
  <rect x="222" y="365" width="700" height="24" rx="12" fill="#edf0f6"/>
  <rect x="222" y="365" width="386" height="24" rx="12" fill="url(#accent)"/>
  <text x="632" y="383" fill="#4058a6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="700">135 MiB</text>

  <text x="68" y="437" fill="#58657a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14">开启 GPU</text>
  <rect x="222" y="419" width="700" height="24" rx="12" fill="#edf0f6"/>
  <rect x="222" y="419" width="700" height="24" rx="12" fill="#b8c0d1"/>
  <text x="946" y="437" fill="#687387" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="700">245 MiB</text>

  <text x="68" y="482" fill="#929bab" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12">固定负载对照；网络延迟、系统负载与 WebView2 版本会影响结果。</text>
  <text x="1156" y="540" text-anchor="end" fill="#9aa3b2" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12">TYL · To Your Language</text>
</svg>
