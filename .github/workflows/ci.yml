name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: Core lint & test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (tyl-core, native)
        run: cargo clippy -p tyl-core --all-targets -- -D warnings
      - name: Test (tyl-core)
        run: cargo test -p tyl-core
      # Desktop builds and platform tests run on the native jobs below.

  windows:
    name: Build & smoke (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tyl-app/ui/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix apps/tyl-app/ui ci
      - name: Build frontend
        run: npm --prefix apps/tyl-app/ui run build
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build CLI (release)
        run: cargo build --release -p tyl-cli --locked
      # Smoke: anchor/monitors need a real desktop session; capture is
      # interactive (needs a selection), so only verify the binary runs.
      - name: Smoke test
        run: |
          $exe = (Resolve-Path "target/release/tyl-cli.exe").Path
          $process = Start-Process -FilePath $exe -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 2) {
            throw "expected usage exit code 2, got $($process.ExitCode)"
          }
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: tyl-cli-windows
          path: target/release/tyl-cli.exe

      - name: Build app (release)
        run: cargo build --release -p tyl-app --locked
      - name: Bundle NSIS installer
        working-directory: apps/tyl-app
        run: .\ui\node_modules\.bin\tauri.cmd bundle --bundles nsis
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: tyl-app-windows
          path: |
            target/release/tyl-app.exe
            target/release/bundle/nsis/*-setup.exe

  macos:
    name: Build & test (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tyl-app/ui/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix apps/tyl-app/ui ci
      - name: Check frontend
        run: npm --prefix apps/tyl-app/ui run check
      - name: Bundle app
        working-directory: apps/tyl-app
        run: ./ui/node_modules/.bin/tauri build -- --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --release --locked -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --release --locked
      - name: Verify and archive app
        env:
          APP_ARCH: ${{ matrix.arch }}
        run: |
          bundle_dir=target/release/bundle/macos
          app="$bundle_dir/TYL.app"
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/tyl-app" -verify_arch "$APP_ARCH"
          tar -czf "$RUNNER_TEMP/TYL-macos-$APP_ARCH.tar.gz" -C "$bundle_dir" TYL.app
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: tyl-app-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/TYL-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
